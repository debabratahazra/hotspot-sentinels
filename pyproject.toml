[project]
name = "hotspot-sentinels"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Debabrata Hazra", email = "debabrata.hazra@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-pubsub>=2.20.0",
    "google-cloud-storage>=2.14.0",
    "google-genai>=0.1.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
frontend = [
    "streamlit>=1.33.0",
    "streamlit-folium>=0.21.0",
    "streamlit-searchbox>=0.1.24",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.0",
]

# Nothing here is imported as a library — backend/ and frontend/ are run directly,
# so there is no package to build and no src/ tree to keep in sync.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
