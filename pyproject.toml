[project]
name = "hotspot-sentinels"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Debabrata Hazra", email = "debabrata.hazra@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-pubsub>=2.20.0",
    "google-cloud-storage>=2.14.0",
    "google-genai>=0.1.0",
    "pillow>=10.2.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
frontend = [
    "streamlit>=1.33.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
hotspot-sentinels = "hotspot_sentinels:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
